version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    reviewers:
      - "jwcarman"
    ignore:
      # spring-boot.version is the oldest Spring Boot migratory supports, so it takes 4.1 patch
      # releases only; the spring-boot-latest profile, raised by hand, tests the newest.
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Must match the OpenTelemetry version Spring Boot manages; moved by hand with Spring Boot.
      # The observability example's OpenTelemetryLogsTest fails when the two disagree.
      - dependency-name: "io.opentelemetry.instrumentation:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    # Group updates by dependency type
    groups:
      spring:
        patterns:
          - "org.springframework*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.testcontainers*"
        update-types:
          - "minor"
          - "patch"
      build-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "org.jacoco*"
          - "org.sonarsource*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "jwcarman"
    groups:
      # CodeQL refuses to run with its steps on different versions: bump them together
      codeql:
        patterns:
          - "github/codeql-action*"

