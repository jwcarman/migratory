name: Native

# Builds the app in migratory-native-tests as a GraalVM native image and runs it against PostgreSQL
# (see CONTRIBUTING.md). A native build takes minutes, so this runs by hand (before a release), not
# on every push.

# Run by hand when wanted; the build host is the usual native gate (scripts/native-remote.sh).
on:
  workflow_dispatch:

# A newer run replaces one still going.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [ native-app ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up GraalVM 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Build native and test
        env:
          APP: ${{ matrix.app }}
        run: >-
          ./mvnw -B -Pnative-tests -Dnative verify -pl "migratory-native-tests/$APP" -am
          -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload app log and test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-logs
          path: |
            migratory-native-tests/${{ matrix.app }}/target/app.log
            migratory-native-tests/${{ matrix.app }}/target/failsafe-reports/
          if-no-files-found: ignore
