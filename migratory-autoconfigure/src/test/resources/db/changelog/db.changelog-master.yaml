databaseChangeLog:
  - changeSet:
      id: app-1
      author: migratory-test
      changes:
        - createTable:
            tableName: app_note
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: order_line_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_app_note_order_line
                    references: order_line(id)
